<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>صِبا 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#160825;
    --bg2:#2c0f4d;
    --bg3:#5b1a8c;
    --pink:#e879c7;
    --lilac:#c8a2ff;
    --gold:#f4d47c;
    --white-soft:#fbf6ff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(232,121,199,0.25), transparent 55%),
      radial-gradient(ellipse at 80% 85%, rgba(200,162,255,0.25), transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3) 120%);
    font-family:'Cairo', sans-serif;
    color:var(--white-soft);
    overflow:hidden;
  }
  body{ height:100vh; width:100vw; position:relative; }

  /* ---------- stars ---------- */
  .stars{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .stars span{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:var(--white-soft); opacity:.7;
    animation:twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.6); }
  }

  /* ---------- top bunting / garland ---------- */
  .garland{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:center; gap:6px;
    padding-top:6px; pointer-events:none; z-index:5;
  }
  .flag{
    width:22px; height:26px;
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    animation:sway 2.6s ease-in-out infinite;
  }
  .flag:nth-child(odd){ background:linear-gradient(160deg,var(--pink),var(--bg3)); animation-delay:.2s; }
  .flag:nth-child(even){ background:linear-gradient(160deg,var(--lilac),var(--bg3)); animation-delay:.5s; }
  .flag:nth-child(3n){ background:linear-gradient(160deg,var(--gold),var(--bg3)); animation-delay:.8s; }
  @keyframes sway{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }

  /* ---------- balloons ---------- */
  .balloons{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:4; }
  .balloon{
    position:absolute; bottom:-140px;
    width:46px; height:58px; border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
    opacity:.85;
    animation-name:float-up; animation-timing-function:ease-in; animation-iteration-count:infinite;
  }
  .balloon::after{
    content:''; position:absolute; left:50%; bottom:-40px; width:1px; height:40px;
    background:rgba(255,255,255,.35); transform:translateX(-50%);
  }
  @keyframes float-up{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:.85; }
    100%{ transform:translateY(-115vh) translateX(var(--drift,20px)) rotate(8deg); opacity:0; }
  }

  /* ---------- confetti ---------- */
  .confetti{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:4; }
  .piece{
    position:absolute; top:-20px; width:8px; height:14px; opacity:.9;
    animation-name:fall; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    5%{ opacity:.9; }
    100%{ transform:translateY(112vh) rotate(540deg); opacity:.9; }
  }

  /* ---------- date badge ---------- */
  .badge{
    position:absolute; top:38px; left:50%; transform:translateX(-50%);
    font-size:.78rem; letter-spacing:.5px; color:var(--lilac);
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
    padding:5px 14px; border-radius:999px; backdrop-filter:blur(4px);
    z-index:6; white-space:nowrap;
  }

  /* ---------- layout ---------- */
  .stage{
    position:relative; z-index:10; height:100%; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(14px,3vh,28px); padding:70px 18px 30px;
    text-align:center;
  }

  /* ---------- cake ---------- */
  .cake-wrap{ position:relative; width:190px; height:150px; }
  .sparkle{
    position:absolute; font-size:14px; color:var(--gold);
    animation:twinkle 1.8s ease-in-out infinite;
  }
  .plate{
    position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
    width:200px; height:16px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(200,162,255,.35), transparent 70%);
    filter:blur(1px);
  }
  .layer{
    position:absolute; left:50%; transform:translateX(-50%);
    border-radius:14px; box-shadow:inset 0 -8px 14px rgba(0,0,0,.18), 0 6px 16px rgba(0,0,0,.35);
  }
  .layer.bottom{
    bottom:18px; width:170px; height:56px;
    background:linear-gradient(180deg,#a75fe0,#7a2fc2);
  }
  .layer.top{
    bottom:66px; width:120px; height:46px;
    background:linear-gradient(180deg,#f0a8e0,#d472c9);
  }
  .frosting{
    position:absolute; left:50%; transform:translateX(-50%);
    display:flex; gap:4px;
  }
  .frosting.b{ bottom:70px; }
  .frosting.t{ bottom:108px; }
  .frosting span{
    width:14px; height:14px; border-radius:50%;
    background:var(--white-soft); opacity:.9;
  }
    .candles{ position:absolute; bottom:118px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:5; direction:ltr; }
      .candle-num{ position:relative; width:22px; height:34px; border-radius:4px; background:linear-gradient(180deg,var(--gold),#c9971f); display:flex; align-items:center; justify-content:center; font-family:'Cairo',sans-serif; font-weight:800; font-size:18px; color:#2a0a45; box-shadow:0 2px 6px rgba(0,0,0,.35), inset 0 0 5px rgba(255,255,255,.45); }
      .candle-num .flame{ position:absolute; top:-16px; left:50%; transform:translateX(-50%); width:10px; height:16px; border-radius:50% 50% 50% 50%/60% 60% 40% 40%; background:radial-gradient(circle at 50% 30%, #fff3b0, #ffb545 55%, #ff7a3d 90%); box-shadow:0 0 10px 2px rgba(255,170,80,.6); animation:flicker 1.1s ease-in-out infinite; transform-origin:bottom center; }
    @keyframes flicker{
    0%,100%{ transform:translateX(-50%) scale(1) rotate(0deg); }
    30%{ transform:translateX(-50%) scale(0.9,1.1) rotate(-4deg); }
    60%{ transform:translateX(-50%) scale(1.08,0.92) rotate(3deg); }
  }

  /* ---------- message card ---------- */
  .card{
    max-width:520px; width:100%;
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .stack{
    display:flex; flex-direction:column; gap:10px; align-items:center;
    min-height:2.6em; transition:opacity .8s ease;
  }
  .stack.fading{ opacity:0; }
  .line{
    font-size:clamp(1.05rem,4vw,1.55rem); font-weight:700;
    opacity:0; transform:translateY(8px);
    animation:rise .7s ease forwards;
    text-shadow:0 2px 12px rgba(0,0,0,.35);
  }
  .line.soft{ font-weight:600; font-size:clamp(.95rem,3.4vw,1.2rem); color:var(--lilac); }
  .line.eng{ direction:ltr; font-family:'Cairo',sans-serif; }
  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }
  .final-line{
    font-size:clamp(1.1rem,4vw,1.6rem); font-weight:800;
    background:linear-gradient(90deg,var(--gold),var(--pink),var(--lilac));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:rise .9s ease forwards, glow 3s ease-in-out infinite 1s;
  }
  @keyframes glow{
    0%,100%{ filter:drop-shadow(0 0 2px rgba(255,255,255,.15)); }
    50%{ filter:drop-shadow(0 0 10px rgba(255,255,255,.45)); }
  }

  .next-btn{
    border:none; cursor:pointer; font-family:'Cairo',sans-serif;
    font-size:1rem; font-weight:700; color:#2a0a45;
    padding:12px 34px; border-radius:999px;
    background:linear-gradient(90deg,var(--gold),var(--pink));
    box-shadow:0 6px 20px rgba(232,121,199,.35);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .next-btn:hover{ transform:translateY(-2px); box-shadow:0 10px 26px rgba(232,121,199,.5); }
  .next-btn:active{ transform:translateY(0); }
  .next-btn.hidden{ display:none; }

  .sound-toggle{
    position:absolute; bottom:18px; left:18px; z-index:20;
    width:40px; height:40px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
    color:var(--white-soft); font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>
  <div class="balloons" id="balloons"></div>
  <div class="confetti" id="confetti"></div>

  <div class="garland" id="garland"></div>
  <div class="badge">🎉 Happy Birthday • 22 Sep 🎉</div>

  <div class="stage">
    <div class="cake-wrap" id="cake">
      <div class="plate"></div>
      <div class="layer bottom"></div>
      <div class="frosting b" id="frostB"></div>
      <div class="layer top"></div>
      <div class="frosting t" id="frostT"></div>
            <div class="candles">
                              <div class="candle-num">1<span class="flame"></span></div>
                      <div class="candle-num">8<span class="flame"></span></div>
            </div>
    </div>

    <div class="card">
      <div class="stack" id="stack"></div>
      <button class="next-btn" id="nextBtn">التالي</button>
    </div>
  </div>

  <button class="sound-toggle" id="soundToggle" title="كتم / تشغيل الصوت">🔊</button>

  <!-- ضعي ملف الأغنية باسم open.mp3 بجانب هذا الملف قبل الرفع -->
  <audio id="bgm" src="open.mp3" preload="auto" loop></audio>

<script>
/* ============ decorations ============ */
const starsBox = document.getElementById('stars');
for(let i=0;i<60;i++){
  const s=document.createElement('span');
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*70+'%';
  s.style.animationDelay=(Math.random()*3)+'s';
  starsBox.appendChild(s);
}

const garland = document.getElementById('garland');
for(let i=0;i<13;i++){
  const f=document.createElement('div');
  f.className='flag';
  f.style.animationDelay=(i*0.12)+'s';
  garland.appendChild(f);
}

const balloonColors = ['#e879c7','#c8a2ff','#f4d47c','#fbf6ff','#a75fe0'];
const balloonsBox = document.getElementById('balloons');
for(let i=0;i<12;i++){
  const b=document.createElement('div');
  b.className='balloon';
  const color = balloonColors[i % balloonColors.length];
  b.style.background = `radial-gradient(circle at 32% 28%, #fff8, ${color} 60%)`;
  b.style.left = (Math.random()*90)+'%';
  b.style.setProperty('--drift', (Math.random()*80-40)+'px');
  b.style.animationDuration = (10+Math.random()*8)+'s';
  b.style.animationDelay = (Math.random()*12)+'s';
  balloonsBox.appendChild(b);
}

const confettiColors = ['#e879c7','#c8a2ff','#f4d47c','#fbf6ff'];
const confettiBox = document.getElementById('confetti');
for(let i=0;i<45;i++){
  const c=document.createElement('div');
  c.className='piece';
  c.style.left=(Math.random()*100)+'%';
  c.style.background=confettiColors[i % confettiColors.length];
  c.style.animationDuration=(4+Math.random()*4)+'s';
  c.style.animationDelay=(Math.random()*6)+'s';
  confettiBox.appendChild(c);
}

for(const id of ['frostB','frostT']){
  const box=document.getElementById(id);
  const count = id==='frostB' ? 9 : 6;
  for(let i=0;i<count;i++){
    const dot=document.createElement('span');
    box.appendChild(dot);
  }
}

for(let i=0;i<5;i++){
  const sp=document.createElement('span');
  sp.className='sparkle'; sp.textContent='✦';
  sp.style.left=(10+Math.random()*160)+'px';
  sp.style.top=(Math.random()*40)+'px';
  sp.style.animationDelay=(Math.random()*2)+'s';
  document.getElementById('cake').appendChild(sp);
}

/* ============ sound toggle ============ */
const bgm = document.getElementById('bgm');
            bgm.volume = 0.05;
const soundToggle = document.getElementById('soundToggle');
soundToggle.addEventListener('click', ()=>{
  bgm.muted = !bgm.muted;
  soundToggle.textContent = bgm.muted ? '🔇' : '🔊';
});

/* ============ message sequence ============ */
const stack = document.getElementById('stack');
const nextBtn = document.getElementById('nextBtn');
let step = 0;

function addLine(text, opts={}){
  const p=document.createElement('p');
  p.className='line'+(opts.soft?' soft':'')+(opts.eng?' eng':'')+(opts.final?' final-line':'');
  p.textContent=text;
  stack.appendChild(p);
  return p;
}

function clearStack(){ stack.innerHTML=''; stack.classList.remove('fading'); }
function fadeStack(){ stack.classList.add('fading'); }

nextBtn.addEventListener('click', ()=>{
  step++;

  if(step===1){
    clearStack();
    addLine('You asked me to heal you?', {eng:true});
    return;
  }

  if(step===2){
    clearStack();
    addLine('I will.... by making you feel happy', {eng:true});
    return;
  }

  if(step===3){
    nextBtn.classList.add('hidden');
              const seekTo47 = () => { bgm.currentTime = 47; };
              if (bgm.readyState >= 1) { seekTo47(); } else { bgm.addEventListener('loadedmetadata', seekTo47, { once: true }); }
          bgm.play().catch(()=>{ /* المتصفح منع التشغيل التلقائي، اضغطي زر الصوت */ });
    clearStack();
    runStory();
  }
});

function runStory(){
  // ---- المجموعة الأولى ----
  setTimeout(()=> addLine('كل عاااااام وانتي بألف بخيييييير 🤍'), 0);
  setTimeout(()=> addLine('الله يجعله عام جميل وسعيد عليكي', {soft:true}), 2000);
  setTimeout(()=> addLine('بوجودي طبعا :)', {soft:true}), 4000);
  setTimeout(fadeStack, 7000);
  setTimeout(()=>{
    clearStack();
    // ---- المجموعة الثانية ----
    addLine('بوصيكِ من القلب ألا تتركي الصلاة 🤍');
    setTimeout(()=> addLine('وشغفكِ بالتصوير ما يوقف', {soft:true}), 3000);
    setTimeout(()=> addLine("I'm always here to support you", {eng:true, soft:true}), 3000+5000);
    setTimeout(fadeStack, 3000+5000+3000);
    setTimeout(()=>{
      clearStack();
      addLine('وإن شاء الله يوماً ما يتم لقاكِ بالحلال طبعاً 💜', {final:true});
    }, 3000+5000+3000+800);
  }, 7800);
}
</script>
</body>
</html>
